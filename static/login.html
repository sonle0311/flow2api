<!DOCTYPE html>
<html data-i18n-page="login" lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title data-i18n="登录 - Flow2API">登录 - Flow2API</title>
    <script src="/static/i18n.js"></script>
    <link rel="stylesheet" href="/static/instrument-utilities.css">
    <style>
        @keyframes slide-up{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
        .animate-slide-up{animation:slide-up .3s ease-out}
    </style>
    <link rel="stylesheet" href="/static/instrument.css">
    <link rel="stylesheet" href="/static/instrument-access.css">
</head>
<body class="instrument-auth">
    <div class="login-shell">
        <section class="login-brand">
            <div class="login-logo"><span class="login-logo-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V7h12M6 12h8M13 17l5-5-5-5"/></svg></span><span>flow2api</span></div>
            <div class="login-pitch">
                <p class="login-eyebrow"><span data-i18n="管理员控制台">管理员控制台</span></p>
                <h1 data-i18n="一个接口，生成图片与视频">一个接口，生成图片与视频</h1>
                <p class="login-lead" data-i18n="把 Google Flow 账号变成可供你所有项目调用的生成服务。">把 Google Flow 账号变成可供你所有项目调用的生成服务。</p>
                <ul class="login-features">
                    <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 6-6 6 6 6m8-12 6 6-6 6"/></svg><span data-i18n="OpenAI 与 Gemini 兼容接口">OpenAI 与 Gemini 兼容接口</span></li>
                    <li><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m2-16a3 3 0 0 1 0 6m2 4a6 6 0 0 1 3 5v1"/></svg><span data-i18n="多账号轮换与并发控制">多账号轮换与并发控制</span></li>
                    <li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 15-5-5L6 20"/></svg><span data-i18n="图片、视频与参考图生成">图片、视频与参考图生成</span></li>
                </ul>
            </div>
            <figure class="login-terminal" aria-hidden="true">
                <figcaption><i></i><i></i><i></i><span>POST /v1/chat/completions</span><b>200</b></figcaption>
<pre>{
  <u>"model"</u>: <em>"veo-3.1-fast"</em>,
  <u>"generationConfig"</u>: {
    <u>"videoConfig"</u>: {
      <u>"aspectRatio"</u>: <em>"16:9"</em>,
      <u>"durationSeconds"</u>: <s>8</s>
    }
  }
}</pre>
            </figure>
            <p class="login-copyright">Flow2API © 2025</p>
        </section>
        <main class="login-panel">
            <header class="login-panel-top">
                <select data-language-select aria-label="Language" class="login-language"><option value="zh-CN">中文</option><option value="en">English</option><option value="vi">Tiếng Việt</option></select>
            </header>
            <section class="login-card" aria-labelledby="authHeading">
                <h2 id="authHeading" data-i18n="登录">登录</h2>
                <p class="login-card-lead" data-i18n="使用管理员账户继续">使用管理员账户继续</p>
                <form id="loginForm" method="post" action="/api/login">
                    <div class="login-field">
                        <label for="username"><span data-i18n="账户">账户</span></label>
                        <div class="login-input"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg><input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="请输入账户" data-i18n-placeholder="请输入账户"></div>
                    </div>
                    <div class="login-field">
                        <label for="password"><span data-i18n="密码">密码</span></label>
                        <div class="login-input"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><input type="password" id="password" name="password" autocomplete="current-password" required placeholder="请输入密码" data-i18n-placeholder="请输入密码"><button type="button" id="togglePassword" class="login-reveal" aria-pressed="false" aria-label="显示或隐藏密码" data-i18n-aria-label="显示或隐藏密码"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
                    </div>
                    <button type="submit" id="loginButton"><span data-i18n="登录">登录</span></button>
                </form>
                <form id="changeForm" hidden>
                    <div class="login-field">
                        <label for="newPassword"><span data-i18n="新密码">新密码</span></label>
                        <div class="login-input"><input type="password" id="newPassword" autocomplete="new-password" minlength="8" maxlength="72" required placeholder="至少 8 位" data-i18n-placeholder="至少 8 位"></div>
                    </div>
                    <div class="login-field">
                        <label for="confirmPassword"><span data-i18n="确认新密码">确认新密码</span></label>
                        <div class="login-input"><input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" maxlength="72" required placeholder="再次输入新密码" data-i18n-placeholder="再次输入新密码"></div>
                    </div>
                    <button type="submit" id="changeButton"><span data-i18n="修改密码">修改密码</span></button>
                </form>
                <p class="login-note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.4 8 8 9 4.6-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg><span data-i18n="登录后可管理账号、系统配置与请求日志。">登录后可管理账号、系统配置与请求日志。</span></p>
            </section>
        </main>
    </div>

    <script>
        const form=document.getElementById('loginForm'),btn=document.getElementById('loginButton');
        const changeForm=document.getElementById('changeForm'),changeBtn=document.getElementById('changeButton'),heading=document.getElementById('authHeading'),lead=document.querySelector('.login-card-lead');
        let pending=null;
        function showLogin(){pending=null;changeForm.hidden=true;form.hidden=false;I18n.setMessage(heading,I18n.t("登录"));I18n.setMessage(lead,I18n.t("使用管理员账户继续"));document.getElementById('password').value='';changeForm.reset()}
        form.addEventListener('submit',async(e)=>{e.preventDefault();btn.disabled=true;I18n.setMessage(btn, I18n.t("登录中..."));try{const fd=new FormData(form),password=fd.get('password'),r=await fetch('/api/login',{method:'POST',credentials:'include',headers:{...I18n.headers(),'Content-Type':'application/json'},body:JSON.stringify({username:fd.get('username'),password})});const d=await r.json();if(d.success&&d.must_change_password){pending={token:d.token,old:password};form.hidden=true;changeForm.hidden=false;I18n.setMessage(heading,I18n.t("请先修改默认密码"));I18n.setMessage(lead,I18n.t("当前仍是默认密码，设置新密码后才能使用控制台"));document.getElementById('newPassword').focus()}else if(d.success){location.href='/console'}else showToast(d.message||d.detail||I18n.t("登录失败"),'error')}catch(e){showToast(I18n.t("网络错误,请稍后重试"),'error')}finally{btn.disabled=false;I18n.setMessage(btn, I18n.t("登录"))}});
        changeForm.addEventListener('submit',async(e)=>{e.preventDefault();if(!pending)return;const next=document.getElementById('newPassword').value;if(next!==document.getElementById('confirmPassword').value){showToast(I18n.t("两次输入的密码不一致"),'error');return}changeBtn.disabled=true;try{const r=await fetch('/api/admin/change-password',{method:'POST',credentials:'include',headers:{...I18n.headers(),'Content-Type':'application/json',Authorization:'Bearer '+pending.token},body:JSON.stringify({old_password:pending.old,new_password:next})});const d=await r.json();if(d.success){showLogin();showToast(I18n.t("密码已修改，请使用新密码登录"),'success')}else showToast(d.message||d.detail||I18n.t("登录失败"),'error')}catch(e){showToast(I18n.t("网络错误,请稍后重试"),'error')}finally{changeBtn.disabled=false}});
        function showToast(m,t='error'){const d=document.createElement('div'),bc={success:'bg-green-600',error:'bg-destructive',info:'bg-primary'};d.className=`login-toast fixed bottom-4 right-4 ${bc[t]||bc.error} text-white px-4 py-2.5 rounded-lg shadow-lg text-sm font-medium z-50 animate-slide-up`;I18n.setMessage(d, m);document.body.appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .3s';setTimeout(()=>d.parentNode&&document.body.removeChild(d),300)},2000)}
        (()=>{const p=document.getElementById('password'),g=document.getElementById('togglePassword');g.addEventListener('click',()=>{const s=p.type==='password';p.type=s?'text':'password';g.setAttribute('aria-pressed',String(s));p.focus()})})();
        (()=>{fetch('/api/stats',{credentials:'include',headers:I18n.headers()}).then(r=>{if(r.ok)location.href='/console'}).catch(()=>{})})();

    </script>
</body>
</html>
