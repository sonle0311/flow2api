<!DOCTYPE html>
<html data-i18n-page="login" lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title data-i18n="登录 - Flow2API">登录 - Flow2API</title>
    <script src="/static/i18n.js"></script>
    <link rel="stylesheet" href="/static/instrument-utilities.css">
    <style>
        @keyframes slide-up{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
        .animate-slide-up{animation:slide-up .3s ease-out}
    </style>
    <link rel="stylesheet" href="/static/instrument.css">
    <link rel="stylesheet" href="/static/instrument-access.css">
</head>
<body class="instrument-auth h-full bg-background text-foreground antialiased">
    <header class="auth-header">
        <select data-language-select aria-label="Language" class="auth-language h-8 rounded-md border border-input bg-background px-2 text-xs"><option value="zh-CN">中文</option><option value="en">English</option><option value="vi">Tiếng Việt</option></select>
    </header>
    <main class="auth-main">
        <div class="auth-identity">
            <svg class="auth-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M9 29V11h22M9 20h16M22 29l9-9-9-9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <h1 class="auth-wordmark">Flow2API</h1>
            <p class="auth-subtitle"><span data-i18n="管理员控制台">管理员控制台</span></p>
        </div>
        <section class="auth-gateway" aria-labelledby="authHeading">
                <h2 id="authHeading" class="auth-heading" data-i18n="登录">登录</h2>
                <form id="loginForm" method="post" action="/api/login" class="space-y-6">
                    <div class="space-y-2">
                        <label for="username" class="text-sm font-medium"><span data-i18n="账户">账户</span></label>
                        <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:opacity-50" placeholder="请输入账户" data-i18n-placeholder="请输入账户">
                    </div>
                    <div class="space-y-2">
                        <label for="password" class="text-sm font-medium"><span data-i18n="密码">密码</span></label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:opacity-50" placeholder="请输入密码" data-i18n-placeholder="请输入密码">
                    </div>
                    <button type="submit" id="loginButton" class="inline-flex items-center justify-center rounded-md font-medium transition-colors bg-primary text-primary-foreground hover:bg-primary/90 h-10 w-full disabled:opacity-50"><span data-i18n="登录">登录</span></button>
                </form>

        </section>
    </main>
    <footer class="auth-footer">Flow2API © 2025</footer>

    <script>
        const form=document.getElementById('loginForm'),btn=document.getElementById('loginButton');
        form.addEventListener('submit',async(e)=>{e.preventDefault();btn.disabled=true;I18n.setMessage(btn, I18n.t("登录中..."));try{const fd=new FormData(form),r=await fetch('/api/login',{method:'POST',credentials:'include',headers:{...I18n.headers(),'Content-Type':'application/json'},body:JSON.stringify({username:fd.get('username'),password:fd.get('password')})});const d=await r.json();if(d.success){location.href='/manage'}else showToast(d.message||d.detail||I18n.t("登录失败"),'error')}catch(e){showToast(I18n.t("网络错误,请稍后重试"),'error')}finally{btn.disabled=false;I18n.setMessage(btn, I18n.t("登录"))}});
        function showToast(m,t='error'){const d=document.createElement('div'),bc={success:'bg-green-600',error:'bg-destructive',info:'bg-primary'};d.className=`fixed bottom-4 right-4 ${bc[t]||bc.error} text-white px-4 py-2.5 rounded-lg shadow-lg text-sm font-medium z-50 animate-slide-up`;I18n.setMessage(d, m);document.body.appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .3s';setTimeout(()=>d.parentNode&&document.body.removeChild(d),300)},2000)}
        (()=>{fetch('/api/stats',{credentials:'include',headers:I18n.headers()}).then(r=>{if(r.ok)location.href='/manage'}).catch(()=>{})})();

    </script>
</body>
</html>
