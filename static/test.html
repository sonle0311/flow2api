<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e1e1e6; min-height: 100vh; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
h1 { text-align: center; margin-bottom: 8px; font-size: 24px; color: #7c8aff; }
.subtitle { text-align: center; color: #666; margin-bottom: 24px; font-size: 14px; }

.config-bar {
  display: flex; gap: 12px; margin-bottom: 20px; align-items: center;
  background: #1a1b26; padding: 12px 16px; border-radius: 10px; border: 1px solid #2a2b3a;
}
.config-bar label { font-size: 13px; color: #888; white-space: nowrap; }
.config-bar input { flex: 1; background: #0f1117; border: 1px solid #2a2b3a; color: #e1e1e6; padding: 8px 12px; border-radius: 6px; font-size: 14px; }
.config-note { margin-bottom: 20px; font-size: 12px; color: #7f8498; }

.main-layout { display: flex; gap: 20px; }
.sidebar { width: 280px; flex-shrink: 0; }
.content { flex: 1; min-width: 0; }

.model-section { margin-bottom: 16px; }
.section-title {
  font-size: 13px; font-weight: 600; color: #7c8aff; padding: 8px 12px;
  background: #1a1b26; border-radius: 8px 8px 0 0; border: 1px solid #2a2b3a; border-bottom: none;
  cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center;
}
.section-title:hover { background: #1e1f2e; }
.section-title .arrow { transition: transform 0.2s; }
.section-title.collapsed .arrow { transform: rotate(-90deg); }
.model-list {
  background: #1a1b26; border: 1px solid #2a2b3a; border-radius: 0 0 8px 8px;
  max-height: 300px; overflow-y: auto;
}
.model-list.hidden { display: none; }
.model-item {
  padding: 8px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #1e1f2e;
  display: flex; justify-content: space-between; align-items: center;
}
.model-item:last-child { border-bottom: none; }
.model-item:hover { background: #1e1f2e; }
.model-item.active { background: #2a2b5a; color: #7c8aff; }
.model-tag {
  font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 500;
}
.tag-image { background: #1a3a2a; color: #4ade80; }
.tag-video { background: #3a2a1a; color: #fb923c; }

.gen-panel {
  background: #1a1b26; border: 1px solid #2a2b3a; border-radius: 10px; padding: 20px;
}
.gen-panel h3 { font-size: 16px; margin-bottom: 4px; }
.gen-panel .model-info { font-size: 12px; color: #666; margin-bottom: 16px; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; }
.form-group textarea, .form-group input[type="text"] {
  width: 100%; background: #0f1117; border: 1px solid #2a2b3a; color: #e1e1e6;
  padding: 10px 12px; border-radius: 8px; font-size: 14px;
  font-family: inherit;
}
.form-group textarea { resize: vertical; min-height: 80px; }
.form-group textarea:focus, .form-group input[type="text"]:focus { outline: none; border-color: #7c8aff; }

.image-upload-area {
  border: 2px dashed #2a2b3a; border-radius: 8px; padding: 20px; text-align: center;
  cursor: pointer; transition: border-color 0.2s; position: relative;
}
.image-upload-area:hover { border-color: #7c8aff; }
.image-upload-area.has-images { padding: 10px; }
.image-upload-hint { color: #555; font-size: 13px; }
.image-preview-list { display: flex; gap: 8px; flex-wrap: wrap; }
.image-preview-item {
  position: relative; width: 80px; height: 80px; border-radius: 6px; overflow: hidden;
}
.image-preview-item img { width: 100%; height: 100%; object-fit: cover; }
.image-preview-item .remove-btn {
  position: absolute; top: 2px; right: 2px; width: 20px; height: 20px;
  background: rgba(0,0,0,0.7); color: #fff; border: none; border-radius: 50%;
  cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center;
}

.btn-generate {
  width: 100%; padding: 12px; background: #7c8aff; color: #fff; border: none;
  border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
  transition: background 0.2s;
}
.btn-generate:hover { background: #6b79ee; }
.btn-generate:disabled { background: #3a3b5a; cursor: not-allowed; }

.output-panel {
  background: #1a1b26; border: 1px solid #2a2b3a; border-radius: 10px; padding: 20px; margin-top: 16px;
}
.output-panel h3 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status-idle { background: #555; }
.status-running { background: #facc15; animation: pulse 1s infinite; }
.status-done { background: #4ade80; }
.status-error { background: #f87171; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.output-log {
  background: #0f1117; border-radius: 8px; padding: 12px; font-size: 13px;
  line-height: 1.6; max-height: 200px; overflow-y: auto; white-space: pre-wrap;
  word-break: break-all; color: #aaa;
}
.output-result { margin-top: 12px; }
.output-result img { max-width: 100%; border-radius: 8px; margin-top: 8px; }
.output-result video { max-width: 100%; border-radius: 8px; margin-top: 8px; }

.model-list::-webkit-scrollbar, .output-log::-webkit-scrollbar { width: 4px; }
.model-list::-webkit-scrollbar-thumb, .output-log::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

@media (max-width: 768px) {
  .main-layout { flex-direction: column; }
  .sidebar { width: 100%; }
  .config-bar { flex-wrap: wrap; }
}

function placeStudioSettings() {
  const mobile = document.getElementById('studioMobileSettings');
  const settings = document.getElementById('studioModelInspector');
  if (studioCompactLayout.matches) mobile.append(settings);
  else document.querySelector('.studio-inspector').prepend(settings);
  mobile.hidden = !studioCompactLayout.matches;
}
placeStudioSettings();
studioCompactLayout.addEventListener('change', placeStudioSettings);

// Normalize legacy underscore ids so both catalog styles classify identically.
function normalizeModelId(modelId) {
  return String(modelId).toLowerCase().replace(/_/g, "-");
}

// Model family determines reference inputs independently of output resolution.
function getModelFamily(modelId) {
  const norm = normalizeModelId(modelId);
  if (norm.includes("image")) return "image";
  if (norm.includes("i2v") || norm.includes("interpolation")) return "i2v";
  if (norm.includes("r2v")) return "r2v";
  if (norm.includes("omni") || norm.includes("abra")) return "omni";
  if (norm.includes("extend")) return "extend";
  return "t2v";
}

// Model categories for sidebar
const MODEL_CATEGORIES = [
  "Gemini 3.1 Flash 图片", "Nano Banana 2 Lite 图片", "Gemini 3.0 Pro 图片",

  "Omni 视频", "视频续写 (Extend)", "视频放大 (Upsample)", "其他图片模型", "其他视频模型",
];

function getModelCategory(modelId) {
  const id = normalizeModelId(modelId);
  if (getModelType(id) === 'image') {
    if (id.startsWith('gemini-3.1-flash-lite-image')) return 'Nano Banana 2 Lite 图片';
    if (id.startsWith('gemini-3.1-flash-image')) return 'Gemini 3.1 Flash 图片';
    if (id.startsWith('gemini-3.0-pro-image')) return 'Gemini 3.0 Pro 图片';
    return '其他图片模型';

  if (id.includes('4k') || id.includes('1080p')) return '视频放大 (Upsample)';
  if (/^(?:omni|abra)(?:[_.-]|$)/.test(id)) return 'Omni 视频';
  if (id.includes('extend')) return '视频续写 (Extend)';
  if (id.includes('i2v') || id.includes('interpolation')) return 'Veo 3.1 图生视频 (I2V)';

  if (/^veo(?:_|-)/.test(id)) return 'Veo 3.1 文生视频 (T2V)';
  return '其他视频模型';
}

let ALL_MODELS = {};
let studioFamilies = new Map();
let catalogSource = '内置候选模型';

// Derive controls only from concrete IDs in the returned public catalog. Every
// selection resolves to an existing ID; no undocumented combination is created.
function parseStudioVariant(id) {
  const image = /^(gemini-3\.[01]-(?:flash(?:-lite)?|pro)-image)-(landscape|portrait|square|four-three|three-four)(?:-(2k|4k))?$/.exec(id);
  const ratios = {landscape: '16:9', portrait: '9:16', square: '1:1', 'four-three': '4:3', 'three-four': '3:4'};
  if (image) return {family: image[1], id, aspect: ratios[image[2]], size: (image[3] || '1k').toUpperCase()};
  const video = /^(.+?)(?:-(i2v|r2v|extend))?-(\d+)s-(landscape|portrait)$/.exec(id);
  if (video && /^(?:veo-3\.1|omni-|abra-)/.test(id)) {
    return {family: video[1], id, mode: video[2] || (/^(?:omni|abra)-/.test(id) ? 'auto' : 't2v'), duration: Number(video[3]), aspect: ratios[video[4]]};
  }
  return null;
}

function studioFamilyLabel(id) {
  const labels = {'gemini-3.1-flash-image': 'Gemini 3.1 Flash', 'gemini-3.1-flash-lite-image': 'Nano Banana 2 Lite', 'gemini-3.0-pro-image': 'Gemini 3.0 Pro'};
  return labels[id] || id.replace(/^veo-/, 'Veo ').replace(/^omni-/, 'Omni ').replace(/-flash$/, ' Flash').replace(/-fast$/, ' Fast').replace(/-quality$/, ' Quality');
}

function rebuildStudioModels() {
  studioFamilies = new Map();
  const ids = Object.keys(ALL_MODELS).sort();
  ids.forEach(id => {
    const variant = parseStudioVariant(id);
    if (!variant) return;
    if (!studioFamilies.has(variant.family)) studioFamilies.set(variant.family, []);
    studioFamilies.get(variant.family).push(variant);
  });
  const select = document.getElementById('studioModel');
  select.replaceChildren(new Option(I18n.t('请选择模型'), ''));
  const families = document.createElement('optgroup');
  families.label = I18n.t('模型与参数');
  [...studioFamilies.keys()].sort().forEach(id => families.append(new Option(studioFamilyLabel(id), id)));
  if (families.children.length) select.append(families);
  const exact = document.createElement('optgroup');
  exact.label = I18n.t('精确模型 ID');
  ids.filter(id => !studioFamilies.has(id) && !parseStudioVariant(id)).forEach(id => exact.append(new Option(id, id)));
  if (exact.children.length) select.append(exact);
  syncStudioControls();
  I18n.setText('catalogStatus', catalogSource);
}

function preferredStudioVariant(variants) {
  return [...variants].sort((a, b) =>
    Number(b.duration === 8) - Number(a.duration === 8) ||
    Number(b.mode === 't2v' || b.mode === 'auto') - Number(a.mode === 't2v' || a.mode === 'auto') ||
    Number(b.aspect === '16:9') - Number(a.aspect === '16:9') ||
    Number(b.size === '1K') - Number(a.size === '1K') || (a.duration || 0) - (b.duration || 0)
  )[0];
}

const studioModeLabels = {auto: '自动', t2v: '文生视频', i2v: '图生视频', r2v: '多图视频', extend: '视频续写'};
function syncStudioControls() {
  const variant = parseStudioVariant(STATE.selectedModel || '');
  const family = variant?.family || STATE.selectedModel;
  const select = document.getElementById('studioModel');
  // Direct programmatic/legacy selection may be outside the current catalog.
  if (family && !Array.from(select.options).some(option => option.value === family)) select.add(new Option(family, family));
  select.value = family || '';
  select.options[0].disabled = Boolean(STATE.selectedModel);
  const variants = studioFamilies.get(family);
  const selected = variants?.find(item => item.id === STATE.selectedModel);
  document.getElementById('studioParameters').hidden = !selected;
  document.getElementById('studioParameterNote').hidden = Boolean(selected);
  document.getElementById('studioUseParameters').hidden = !variants?.length || Boolean(variant);
  if (!selected) return;
  let candidates = variants;
  for (const [key, suffix] of [['mode', 'Mode'], ['duration', 'Duration'], ['aspect', 'Aspect'], ['size', 'Size']]) {
    const input = document.getElementById(`studio${suffix}`);
    const values = [...new Set(candidates.map(item => item[key]).filter(value => value !== undefined))];
    if (key === 'duration') values.sort((a, b) => a - b);
    document.getElementById(`studio${suffix}Group`).hidden = values.length === 0;
    input.replaceChildren(...values.map(value => new Option(key === 'mode' ? I18n.t(studioModeLabels[value] || value) : key === 'duration' ? `${value}s` : value, value)));
    input.value = String(selected[key] ?? '');
    if (values.length) candidates = candidates.filter(item => String(item[key]) === input.value);
  }
}

document.getElementById('studioUseParameters').addEventListener('click', () => {
  const variants = studioFamilies.get(STATE.selectedModel);
  if (variants?.length) selectModel(preferredStudioVariant(variants).id, {preserveInputs: true});
});

document.getElementById('studioModel').addEventListener('change', event => {
  const variants = studioFamilies.get(event.target.value);
  if (variants?.length) selectModel(preferredStudioVariant(variants).id);
  else if (event.target.value) selectModel(event.target.value);
});
for (const [key, suffix] of [['mode', 'Mode'], ['duration', 'Duration'], ['aspect', 'Aspect'], ['size', 'Size']]) {
  document.getElementById(`studio${suffix}`).addEventListener('change', event => {
    let candidates = studioFamilies.get(document.getElementById('studioModel').value) || [];
    const order = [['mode', 'Mode'], ['duration', 'Duration'], ['aspect', 'Aspect'], ['size', 'Size']];
    for (const [preceding, field] of order) {
      const value = preceding === key ? event.target.value : document.getElementById(`studio${field}`).value;
      const matching = candidates.filter(item => String(item[preceding]) === value);
      if (matching.length) candidates = matching;
      if (preceding === key) break;
    }
    const current = parseStudioVariant(STATE.selectedModel || '');
    const matched = candidates.find(item => item.aspect === current?.aspect && item.size === current?.size) || preferredStudioVariant(candidates);
    if (matched) selectModel(matched.id, {preserveInputs: true});
  });
}

function applyFallbackModels(reason) {
  console.warn(I18n.t("使用内置候选模型列表:"), reason);
  ALL_MODELS = { ...FALLBACK_MODELS };
  catalogSource = '内置候选模型';
  renderSidebar();
}

async function loadModels() {
  const baseUrl = (document.getElementById("baseUrl").value || "").trim();
  const apiKey = (document.getElementById("apiKey").value || "").trim();
  if (!baseUrl || !apiKey) {
    applyFallbackModels("missing_base_url_or_api_key");
    return;
  }
  try {
    const resp = await fetch(`${baseUrl}/v1/models`, {
      headers: { ...I18n.headers(), "Authorization": `Bearer ${apiKey}` }
    });
    if (!resp.ok) {
      throw new Error(`HTTP ${resp.status}`);
    }
    const data = await resp.json();
    const items = Array.isArray(data.data) ? data.data : [];
    if (!items.length) {
      applyFallbackModels("empty_model_catalog");
      return;
    }
    ALL_MODELS = {};
    items.forEach(m => { if (typeof m.id === 'string') ALL_MODELS[m.id] = m.description || ''; });
    catalogSource = '实时模型目录';
    renderSidebar();
  } catch (e) {
    console.error(I18n.t("加载模型失败:"), e);
    applyFallbackModels(e.message || "load_failed");
  }
}

function renderSidebarFallback() {
  applyFallbackModels("legacy_fallback");
}

function getModelType(modelId) {
  return getModelFamily(modelId) === "image" ? "image" : "video";
}

function getModelMeta(modelId) {
  // Preserve reference inputs for upscale variants and each family's limits.
  const family = getModelFamily(modelId);
  const id = normalizeModelId(modelId);

  if (family === "image") return { type: "image", supportsImages: true, minImages: 0, maxImages: 5 };
  if (id.includes("interpolation")) return { type: "video", supportsImages: true, minImages: 2, maxImages: 2 };
  if (family === "i2v") return { type: "video", supportsImages: true, minImages: 1, maxImages: id.includes("i2v-lite") ? 1 : 2 };
  if (family === "r2v") return { type: "video", supportsImages: true, minImages: String(modelId).toLowerCase().startsWith("veo-") ? 1 : 0, maxImages: 3 };
  if (family === "omni") {
    return { type: "video", supportsImages: true, minImages: 0, maxImages: 3 };
  }
  if (family === "extend") {
    return { type: "video", supportsImages: false, minImages: 0, maxImages: 0, requiresVideoSource: true };
  }
  return { type: "video", supportsImages: false, minImages: 0, maxImages: 0 };
}

function renderSidebar() {
  const sidebar = document.getElementById("modelSidebar");
  sidebar.innerHTML = "";

  const modelIds = Object.keys(ALL_MODELS).sort();
  if (modelIds.length === 0) {
    sidebar.innerHTML = "<div class=\"model-section\"><div class=\"model-list\" style=\"border-radius:8px;\"><div class=\"model-item\" style=\"cursor:default;color:#888;\"><span data-i18n=\"未获取到可用模型，请检查 API Key 或稍后重试\">未获取到可用模型，请检查 API Key 或稍后重试</span></div></div></div>";
    return;
  }

  for (const catName of MODEL_CATEGORIES) {
    const models = modelIds.filter(modelId => getModelCategory(modelId) === catName);
    if (models.length === 0) continue;

    const section = document.createElement("div");
    section.className = "model-section";

    const title = document.createElement("div");
    title.className = "section-title";
    title.tabIndex = 0;
    title.setAttribute('role', 'button');
    title.setAttribute('aria-expanded', 'true');
    title.dataset.category = catName;
    title.innerHTML = `<span>${I18n.t(catName)} (${models.length})</span><span class="arrow">▼</span>`;

    const list = document.createElement("div");
    list.className = "model-list";

    models.forEach(modelId => {
      const item = document.createElement("div");
      item.className = "model-item";
      item.tabIndex = 0;
      item.setAttribute('role', 'button');
      item.setAttribute('aria-pressed', String(modelId === STATE.selectedModel));
      item.dataset.model = modelId;
      item.classList.toggle("active", modelId === STATE.selectedModel);

      const type = getModelType(modelId);
      const shortName = modelId.replace("gemini-3.1-flash-image-", "").replace("gemini-3.1-flash-lite-image-", "").replace("gemini-3.0-pro-image-", "");
      const name = document.createElement('span');
      name.textContent = shortName;
      const tag = document.createElement('span');
      tag.className = `model-tag ${type === 'image' ? 'tag-image' : 'tag-video'}`;
      tag.textContent = I18n.t(type === 'image' ? '图片' : '视频');
      item.append(name, tag);
      item.onclick = () => selectModel(modelId);
      item.onkeydown = event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectModel(modelId); } };
      list.appendChild(item);
    });

    title.onclick = () => {
      title.classList.toggle("collapsed");
      list.classList.toggle("hidden");
      title.setAttribute('aria-expanded', String(!title.classList.contains('collapsed')));
    };
    title.onkeydown = event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); title.click(); } };

    section.appendChild(title);
    section.appendChild(list);
    sidebar.appendChild(section);
  }
  rebuildStudioModels();
}

function selectModel(modelId, options = {}) {
  const previousImages = options.preserveInputs ? [...STATE.images] : [];
  const previousMediaId = options.preserveInputs ? document.getElementById('videoMediaId').value : '';
  STATE.selectedModel = modelId;
  STATE.modelConfig = getModelMeta(modelId);
  STATE.images = previousImages.slice(0, STATE.modelConfig.maxImages);
  STATE.imageEpoch++;
  STATE.pendingImages = 0;
  imageReadQueue = Promise.resolve();

  // Update sidebar active state
  document.querySelectorAll(".model-item").forEach(el => {
    el.classList.toggle("active", el.dataset.model === modelId);
    el.setAttribute('aria-pressed', String(el.dataset.model === modelId));
  });

  // Update panel
  I18n.setRawText(document.getElementById("selectedModelName"), modelId);
  I18n.setMessage(document.getElementById("selectedModelInfo"), ALL_MODELS[modelId] || "");

  // Show/hide image upload
  const uploadGroup = document.getElementById("imageUploadGroup");
  const meta = STATE.modelConfig;
  if (meta.supportsImages) {
    uploadGroup.style.display = "block";
    const limitText = meta.type === "image" ? I18n.t("可选，用于图生图") : I18n.t("{0}-{1}张", {"0": (meta.minImages), "1": (meta.maxImages)});
    I18n.setRawText(document.getElementById("imageLimit"), `(${limitText})`);
  } else {
    uploadGroup.style.display = "none";
  }

  document.getElementById("videoSourceGroup").style.display = meta.requiresVideoSource ? "block" : "none";
  document.getElementById("videoMediaId").value = meta.requiresVideoSource ? previousMediaId : '';

  // Reset image previews
  document.getElementById("imagePreviewList").innerHTML = "";
  document.getElementById("imageHint").style.display = "block";
  renderImagePreviews();
  syncStudioControls();

  // Enable button
  const btn = document.getElementById("btnGenerate");
  btn.disabled = STATE.generating;
  I18n.setMessage(btn, STATE.generating ? I18n.t('⏳ 生成中...') : I18n.t(meta.type === 'image' ? '🎨 生成图片' : '🎬 生成视频'));
}

// Image upload handling
const uploadArea = document.getElementById("imageUploadArea");
const fileInput = document.getElementById("imageFileInput");
let imageReadQueue = Promise.resolve();

uploadArea.onclick = (e) => {
  if (e.target.closest(".remove-btn")) return;
  fileInput.click();
};

document.getElementById('addReference').onclick = () => fileInput.click();
uploadArea.onkeydown = event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); fileInput.click(); } };
uploadArea.ondragover = (e) => { e.preventDefault(); uploadArea.classList.add('is-dragging'); };
uploadArea.ondragleave = () => { uploadArea.classList.remove('is-dragging'); };
uploadArea.ondrop = (e) => {
  e.preventDefault();
  e.stopPropagation();
  uploadArea.classList.remove('is-dragging');
  handleFiles(e.dataTransfer.files);
};

const composer = document.querySelector('.studio-composer');
composer.addEventListener('paste', event => {
  if (!STATE.modelConfig?.supportsImages) return;
  const files = Array.from(event.clipboardData?.files || []).filter(file => file.type.startsWith('image/'));
  if (!files.length) return;
  event.preventDefault();
  handleFiles(files);
});
composer.addEventListener('dragover', event => {
  if (!STATE.modelConfig?.supportsImages || !Array.from(event.dataTransfer?.types || []).includes('Files')) return;
  event.preventDefault();
  uploadArea.classList.add('is-dragging');
});
composer.addEventListener('dragleave', event => { if (!composer.contains(event.relatedTarget)) uploadArea.classList.remove('is-dragging'); });
composer.addEventListener('drop', event => {
  if (!STATE.modelConfig?.supportsImages) return;
  event.preventDefault();
  uploadArea.classList.remove('is-dragging');
  handleFiles(event.dataTransfer?.files || []);
});
document.getElementById('promptInput').addEventListener('keydown', event => {
  if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') { event.preventDefault(); generate(); }
});

fileInput.onchange = () => { handleFiles(fileInput.files); fileInput.value = ""; };

function handleFiles(files) {
  if (!STATE.modelConfig?.supportsImages) return Promise.resolve();
  const maxImages = STATE.modelConfig ? STATE.modelConfig.maxImages : 5;
  const available = Math.max(0, maxImages - STATE.images.length - STATE.pendingImages);
  const selected = Array.from(files).filter(file => file.type.startsWith('image/')).slice(0, available);
  if (!selected.length) return imageReadQueue;
  const epoch = STATE.imageEpoch;
  STATE.pendingImages += selected.length;
  document.getElementById('btnGenerate').disabled = true;
  const batch = Promise.all(selected.map(file => new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = event => resolve(event.target.result);
    reader.onerror = reader.onabort = () => resolve(null);
    try { reader.readAsDataURL(file); } catch (_) { resolve(null); }
  })));
  // Read concurrently, but commit batches in selection order. A model change
  // invalidates every old callback without altering the new model's slots.
  imageReadQueue = imageReadQueue.then(async () => {
    const results = await batch;
    if (epoch !== STATE.imageEpoch) return;
    STATE.pendingImages -= selected.length;
    STATE.images.push(...results.filter(result => typeof result === 'string'));
    renderImagePreviews();
    document.getElementById('btnGenerate').disabled = STATE.generating || STATE.pendingImages > 0;
  });
  return imageReadQueue;
}

function renderImagePreviews() {
  const list = document.getElementById("imagePreviewList");
  const hint = document.getElementById("imageHint");
  list.innerHTML = "";
  hint.style.display = STATE.images.length ? "none" : "block";

  STATE.images.forEach((dataUrl, idx) => {
    const item = document.createElement("div");
    item.className = "image-preview-item";
    const image = document.createElement('img');
    image.src = dataUrl;
    image.alt = I18n.t('参考图片');
    image.dataset.i18nAlt = '参考图片';
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'remove-btn';
    remove.textContent = '×';
    remove.setAttribute('aria-label', I18n.t('移除参考图片'));
    remove.dataset.i18nAriaLabel = '移除参考图片';
    remove.onclick = () => removeImage(idx);
    item.append(image, remove);
    list.appendChild(item);
  });
}

function removeImage(idx) {
  STATE.images.splice(idx, 1);
  renderImagePreviews();
}

// Generation
document.getElementById("btnGenerate").onclick = generate;
document.getElementById('btnCancel').onclick = () => STATE.controller?.abort();

async function generate() {
  if (!STATE.selectedModel || STATE.generating || STATE.pendingImages > 0) return;

  const baseUrl = (document.getElementById("baseUrl").value || "").trim();
  const apiKey = (document.getElementById("apiKey").value || "").trim();
  const prompt = document.getElementById("promptInput").value.trim();
  if (!prompt) { alert(I18n.t("请输入提示词")); return; }
  if (!apiKey) { alert(I18n.t("请输入 API Key")); return; }
  if (!baseUrl) { alert(I18n.t("请输入服务地址")); return; }
  const videoMediaId = STATE.modelConfig.requiresVideoSource
    ? document.getElementById("videoMediaId").value.trim() : "";
  if (STATE.modelConfig.requiresVideoSource && !videoMediaId) {
    alert(I18n.t("请输入源视频的 mediaGenerationId"));
    return;
  }

  STATE.generating = true;
  const controller = new AbortController();
  STATE.controller = controller;
  document.getElementById('btnCancel').hidden = false;
  document.getElementById('studioCanvas').setAttribute('aria-busy', 'true');
  document.getElementById('studioEmpty').hidden = true;
  document.getElementById('studioLog').open = true;
  const btn = document.getElementById("btnGenerate");
  btn.disabled = true;
  I18n.setMessage(btn, I18n.t("⏳ 生成中..."));

  const dot = document.getElementById("statusDot");
  dot.className = "status-dot status-running";
  I18n.setMessage(document.getElementById("statusText"), I18n.t("生成中..."));
  I18n.setRawText(document.getElementById("outputLog"), "");
  document.getElementById("outputResult").innerHTML = "";

  const log = document.getElementById("outputLog");
  const appendLog = (text) => { log.textContent += text; log.scrollTop = log.scrollHeight; };

  // Build messages
  const content = [];
  content.push({ type: "text", text: prompt });
  STATE.images.forEach(dataUrl => {
    content.push({ type: "image_url", image_url: { url: dataUrl } });
  });
  if (videoMediaId) {
    content.push({ type: "image_url", image_url: { url: `extend://${videoMediaId}` } });
  }

  const messages = [{ role: "user", content: content.length === 1 ? prompt : content }];

  const body = { model: STATE.selectedModel, messages, stream: true };

  const startTime = Date.now();
  appendLog(I18n.t("[{0}] 模型: {1}\n", {"0": (new Date().toLocaleTimeString(I18n.locale)), "1": (STATE.selectedModel)}));
  appendLog(I18n.t("[{0}] 提示词: {1}{2}\n", {"0": (new Date().toLocaleTimeString(I18n.locale)), "1": (prompt.substring(0, 100)), "2": (prompt.length > 100 ? '...' : '')}));
  appendLog(I18n.t("[{0}] 开始请求...\n", {"0": (new Date().toLocaleTimeString(I18n.locale))}));

  try {
    const resp = await fetch(`${baseUrl}/v1/chat/completions`, {
      method: "POST",
      headers: { ...I18n.headers(), "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: controller.signal,
    });

    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${errText}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let fullContent = "";
    let buffer = "";
    let sawDone = false;
    function consumeFrame(frame) {
      const data = frame.split(/\r?\n/).filter(line => line.startsWith('data:'))
        .map(line => line.slice(5).replace(/^ /, '')).join('\n').trim();
      if (!data) return;
      if (data === '[DONE]') { sawDone = true; return; }
      let parsed;
      try { parsed = JSON.parse(data); }
      catch (_) { throw new Error(I18n.t('响应流格式无效。')); }
      if (parsed.error) {
        const error = parsed.error.message || JSON.stringify(parsed.error);
        throw new Error(I18n.translateError(error));
      }
      for (const choice of parsed.choices || []) {
        const delta = choice.delta || {};
        if (delta.reasoning_content) appendLog(I18n.translateMessage(delta.reasoning_content));
        if (typeof delta.content === 'string') {
          fullContent += delta.content;
          appendLog(delta.content);
        }
      }
    }
    function drainFrames() {
      let separator;
      while (!sawDone && (separator = /\r?\n\r?\n/.exec(buffer))) {
        const frame = buffer.slice(0, separator.index);
        buffer = buffer.slice(separator.index + separator[0].length);
        consumeFrame(frame);
      }
    }
    try {
      while (!sawDone) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        drainFrames();
      }
      buffer += decoder.decode();
      drainFrames();
      if (!sawDone) throw new Error(I18n.t('响应流意外结束，请检查结果和日志后再重试。'));
      if (!fullContent.trim()) throw new Error(I18n.t('未收到生成结果，请检查日志。'));
      renderResult(fullContent);
      if (!document.getElementById('outputResult').querySelector('img, video')) {
        throw new Error(I18n.t('未收到生成结果，请检查日志。'));
      }
    } finally {
      await reader.cancel().catch(() => {});
      reader.releaseLock();
    }

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    appendLog(I18n.t("\n\n[{0}] 完成，耗时 {1}s\n", {"0": (new Date().toLocaleTimeString(I18n.locale)), "1": (elapsed)}));

    dot.className = "status-dot status-done";
    I18n.setMessage(document.getElementById("statusText"), I18n.t("完成 ({0}s)", {"0": (elapsed)}));

  } catch (e) {
    if (controller.signal.aborted) {
      appendLog(`\n${I18n.t('请求已取消。')}\n`);
      dot.className = 'status-dot status-idle';
      I18n.setText('statusText', '已取消');
    } else {
      appendLog(I18n.t("\n❌ 请求失败: {0}\n", {"0": (e.message)}));
      dot.className = "status-dot status-error";
      I18n.setMessage(document.getElementById("statusText"), I18n.t("失败"));
    }
  } finally {
    STATE.generating = false;
    STATE.controller = null;
    document.getElementById('btnCancel').hidden = true;
    document.getElementById('studioCanvas').setAttribute('aria-busy', 'false');
    document.getElementById('studioEmpty').hidden = document.getElementById('outputResult').children.length > 0;
    btn.disabled = STATE.pendingImages > 0;
    const meta = STATE.modelConfig;
    I18n.setMessage(btn, meta && meta.type === "image" ? I18n.t("🎨 生成图片") : I18n.t("🎬 生成视频"));
  }
}

function renderResult(content) {
  const resultDiv = document.getElementById("outputResult");
  resultDiv.innerHTML = "";

  // Extract markdown images
  const imgRegex = /!\[.*?\]\((.*?)\)/g;
  let match;
  while ((match = imgRegex.exec(content)) !== null) {
    const img = document.createElement("img");
    img.src = match[1];
    img.alt = I18n.t("生成结果");
    img.loading = "lazy";
    resultDiv.appendChild(img);
  }

  // Extract video tags
  const videoRegex = /<video[^>]+src=['"]([^'"]+)['"]/gi;
  while ((match = videoRegex.exec(content)) !== null) {
    const video = document.createElement("video");
    video.src = match[1];
    video.controls = true;
    video.autoplay = true;
    video.loop = true;
    resultDiv.appendChild(video);
  }

  // If no media found, show raw text
  if (resultDiv.children.length === 0 && content.trim()) {
    const pre = document.createElement("pre");
    pre.style.cssText = "color:#aaa;font-size:13px;white-space:pre-wrap;word-break:break-all;";
    I18n.setRawText(pre, content);
    resultDiv.appendChild(pre);
  }
}

// Auto-detect base URL
(function() {
  const baseUrlInput = document.getElementById("baseUrl");
  const apiKeyInput = document.getElementById("apiKey");
  if (!baseUrlInput.value) baseUrlInput.value = window.location.origin;
  try {
    if (!apiKeyInput.value) apiKeyInput.value = localStorage.getItem('flow2api.test.apiKey') || '';
    baseUrlInput.value = localStorage.getItem('flow2api.test.baseUrl') || window.location.origin;
  } catch (_) { /* Testing remains usable when browser storage is disabled. */ }
  apiKeyInput.addEventListener('input', () => {
    try {
      if (apiKeyInput.value) localStorage.setItem('flow2api.test.apiKey', apiKeyInput.value);
      else localStorage.removeItem('flow2api.test.apiKey');
    } catch (_) { /* Optional persistence. */ }
  });
  baseUrlInput.addEventListener('change', () => {
    try { localStorage.setItem('flow2api.test.baseUrl', baseUrlInput.value.trim()); } catch (_) { /* Optional persistence. */ }
  });
  baseUrlInput.addEventListener("change", loadModels);
  apiKeyInput.addEventListener("change", loadModels);
  loadModels();
})();


window.addEventListener('languagechange', () => {
  const collapsed = new Set(Array.from(document.querySelectorAll('.section-title.collapsed'), title => title.dataset.category));
  renderSidebar();
  document.querySelectorAll('.section-title').forEach(title => {
    if (collapsed.has(title.dataset.category)) {
      title.classList.add('collapsed');
      title.nextElementSibling.classList.add('hidden');
      title.setAttribute('aria-expanded', 'false');
    }
  });
  if (!STATE.selectedModel) return;
  document.querySelectorAll('.image-preview-item img').forEach(image => { image.alt = I18n.t('参考图片'); });
  const meta = STATE.modelConfig;
  I18n.setMessage(document.getElementById('selectedModelInfo'), ALL_MODELS[STATE.selectedModel] || '');
  if (meta.supportsImages) {
    const limitText = meta.type === 'image' ? I18n.t('可选，用于图生图') : I18n.t('{0}-{1}张', {0: meta.minImages, 1: meta.maxImages});
    I18n.setRawText(document.getElementById('imageLimit'), `(${limitText})`);
  }
  I18n.setMessage(document.getElementById('btnGenerate'), STATE.generating ? I18n.t('⏳ 生成中...') : I18n.t(meta.type === 'image' ? '🎨 生成图片' : '🎬 生成视频'));
});
        Object.assign(window, {applyFallbackModels, loadModels, renderSidebarFallback, getModelType, getModelMeta, renderSidebar, selectModel, handleFiles, renderImagePreviews, removeImage, generate, renderResult});
    });
    </script>
