<!DOCTYPE html>
<html lang="en" data-i18n-page="desktop">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title data-i18n="VPS 桌面">VPS 桌面</title>
    <script src="/static/i18n.js" defer></script>
    <script src="/static/browser-desktop.js" defer></script>
    <style>
        *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;color:#171717;background:#e5e5e5}::selection{color:#fff;background:#404040}.desktop-shell{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}.desktop-header{background:#fff;border-bottom:1px solid #d4d4d4;padding:1rem 1.25rem}.desktop-toolbar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}.desktop-identity,.desktop-controls{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}.desktop-identity h1{font-size:1rem;font-weight:600;margin:0}.desktop-status{font-size:.8125rem;color:#525252}.desktop-controls button,.desktop-controls select,.desktop-identity a,.desktop-login-link{min-height:2.5rem;border:1px solid #d4d4d4;border-radius:6px;background:#fff;padding:.5rem .75rem;color:#171717;font:inherit;font-size:.8125rem;text-decoration:none}.desktop-controls button{cursor:pointer}.desktop-controls button:hover,.desktop-identity a:hover,.desktop-login-link:hover{background:#f5f5f5}.desktop-controls button:disabled{opacity:.5;cursor:default}.desktop-controls select{max-width:10rem}.desktop-header p{max-width:100ch;font-size:.8125rem;line-height:1.55;margin:.75rem 0 0;color:#525252}.desktop-stage{position:relative;min-height:0;min-width:0;overflow:hidden}.desktop-screen{width:100%;height:100%;overflow:hidden}.desktop-message{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.5rem;text-align:center;pointer-events:none}.desktop-message p{font-size:.9375rem;line-height:1.6;max-width:55ch;margin:0;color:#404040}.desktop-login-link{pointer-events:auto}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #171717;outline-offset:3px}[hidden]{display:none!important}@media(max-width:600px){.desktop-header{padding:.75rem}.desktop-toolbar{gap:.5rem}.desktop-controls{gap:.375rem;width:100%}.desktop-controls button,.desktop-controls select{flex:1;min-width:0;padding:.5rem}.desktop-status{max-width:100%;overflow-wrap:anywhere}.desktop-identity{gap:.5rem}.desktop-identity a{font-size:.75rem}.desktop-header p{font-size:.75rem;line-height:1.5}}
    </style>
</head>
<body>
    <div class="desktop-shell">
        <header class="desktop-header">
            <div class="desktop-toolbar">
                <div class="desktop-identity">
                    <a id="desktopManageLink" href="/manage" data-i18n="返回账号管理">返回账号管理</a>
                    <h1 data-i18n="VPS 桌面">VPS 桌面</h1>
                    <span id="desktopStatus" class="desktop-status" role="status" aria-live="polite" data-i18n="正在连接…">正在连接…</span>
                </div>
                <div class="desktop-controls">
                    <select data-language-select aria-label="Interface language">
                        <option value="zh-CN">简体中文</option>
                        <option value="en">English</option>
                        <option value="vi">Tiếng Việt</option>
                    </select>
                    <button id="desktopReconnect" type="button" disabled data-i18n="重新连接">重新连接</button>
                    <button id="desktopDisconnect" type="button" disabled data-i18n="断开连接">断开连接</button>
                </div>
            </div>
            <p id="desktopInstructions" data-i18n="从账号管理打开登录浏览器，在 Chrome 中登录 Google/Flow，然后关闭该账号配置的所有窗口以同步 Cookie。关闭此桌面标签页不会关闭 Chrome。">从账号管理打开登录浏览器，在 Chrome 中登录 Google/Flow，然后关闭该账号配置的所有窗口以同步 Cookie。关闭此桌面标签页不会关闭 Chrome。</p>
        </header>
        <section class="desktop-stage" data-i18n-aria-label="远程桌面" aria-label="远程桌面">
            <div id="desktopScreen" class="desktop-screen" data-i18n-aria-label="远程桌面画面" aria-label="远程桌面画面"></div>
            <div id="desktopMessage" class="desktop-message">
                <p id="desktopMessageText"></p>
                <a id="desktopLoginLink" class="desktop-login-link" href="/login" hidden data-i18n="登录管理后台">登录管理后台</a>
            </div>
        </section>
    </div>
</body>
</html>
