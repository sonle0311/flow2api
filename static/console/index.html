<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Flow2API Console</title>

<body class="console">

<aside class="side" id="side">

    <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V7h12M6 12h8M13 17l5-5-5-5"/></svg></span>
    <span>flow2api</span>
  </a>
  <nav class="side-nav" data-t-aria-label="shell.navigation">
    <p class="side-group" data-t="nav.group.workspace">Workspace</p>
    <a href="#studio" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="m10 9 5 3.5-5 3.5zM7 2v3m10-3v3"/></svg><span data-t="nav.studio">Studio</span></a>
    <p class="side-group" data-t="nav.group.manage">Manage</p>
    <a href="/manage#tokens"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3m2-17a3 3 0 0 1 0 6m2 4a6 6 0 0 1 3 5v2"/></svg><span data-t="nav.accounts">Accounts</span></a>
    <a href="/manage#logs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5zM8 7h8M8 12h8M8 17h5"/></svg><span data-t="nav.logs">Logs</span></a>
    <p class="side-group" data-t="nav.group.configure">Configure</p>
    <a href="/manage#settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg><span data-t="nav.settings">Settings</span></a>
    <a href="/manage#integration"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"/></svg><span data-t="nav.integration">Integration</span></a>
    <a href="/manage#skills"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/><path d="M19 3v4m-2-2h4"/></svg><span data-t="nav.skills">Skills</span></a>

  <dl class="side-status" id="status" aria-live="polite"></dl>
  <div class="side-foot">
    <label class="visually-hidden" for="language" data-t="shell.language">Language</label>
    <select id="language">
      <option value="vi">Tiếng Việt</option>
      <option value="en">English</option>
      <option value="zh-CN">中文</option>
    </select>
    <button type="button" class="side-icon" id="signOut" data-t-aria-label="shell.signOut" data-t-title="shell.signOut"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>

</aside>
<div class="side-scrim" id="sideScrim"></div>
<header class="topbar">
  <button type="button" class="side-toggle" id="sideToggle" data-t-aria-label="shell.menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <p class="crumb"><span>Console</span><span aria-hidden="true">/</span><strong data-t="nav.studio">Studio</strong></p>
</header>
<main id="view" tabindex="-1">

</main>
